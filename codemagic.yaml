workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.chandailx.coderIT"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/mapping.txt
    publishing
      email:
        recipients:
          - your-email@example.com   # apna email daal do, ya section hata do
        notify:
          success: false
          failure: true

  native-android-workflow:
    name: Native Android Build
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Make gradlew executable
        script: |
          chmod +x ./gradlew
      - name: Build APK
        script: |
          ./gradlew assembleRelease
    artifacts:
      - "**/*.apk"
      - "**/outputs/**/mapping.txt"
    publishing:
      email:
        recipients:
          - your-email@example.com   # apna email daal do, ya section hata do
        notify:
          success: false
          failure: true
